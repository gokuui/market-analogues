[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analogues"
version = "0.1.0"
description = "Market-agnostic historical OHLCV analogue retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "PyYAML>=6",
  "scipy>=1.12",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
ann = ["hnswlib>=0.8"]
dev = ["pytest>=8", "pytest-cov>=5"]
bench = ["stumpy>=1.14", "tslearn>=0.9", "aeon>=1.5", "shapedtw>=1.0.3"]
external-data = ["yfinance==1.5.2", "openpyxl>=3.1"]

[project.scripts]
market-analogues = "market_analogues.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
